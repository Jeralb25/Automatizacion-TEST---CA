appId: com.example.app
---

- evalScript: |
    output.retryCount = 5

- repeat:
    times: 30
    while:
      notVisible: "Catálogo de Productos"

    commands:

      - runFlow:
          when:
            visible: "Reintentar Carga Inicial"
          commands:

            # ==============================================
            # AUMENTAR CONTADOR
            # ==============================================

            - evalScript: |
                output.retryCount = output.retryCount + 1

                if (output.retryCount < 6) {
                  output.nextAction = "retry"
                } else {
                  output.nextAction = "reset"
                }

                console.log("RETRY COUNT = " + output.retryCount)
                console.log("NEXT ACTION = " + output.nextAction)

            # ==============================================
            # REINTENTAR
            # ==============================================

            - runFlow:
                when:
                  visible: "Reintentar Carga Inicial"
                commands:

                  - evalScript: |
                      if (output.nextAction == "retry") {
                        output.doRetry = true
                      } else {
                        output.doRetry = false
                      }

                  - runFlow:
                      when:
                        true: ${output.doRetry}
                      commands:

                        - tapOn:
                            text: "Reintentar Carga Inicial"

            # ==============================================
            # LIMPIAR DATOS
            # ==============================================

            - runFlow:
                when:
                  visible: "Limpiar datos y reiniciar app"
                commands:

                  - tapOn:
                      text: "Limpiar datos y reiniciar app"